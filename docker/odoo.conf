; Local development only. Nothing here is a production secret.
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
admin_passwd = local-dev-only
; Odoo 20.0 listens on 127.0.0.1 by default; in a container the published port needs all interfaces.
http_interface = 0.0.0.0
